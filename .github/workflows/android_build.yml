name: Build Davis Studio APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android_build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle assembleDebug -p android --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk davis-studio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: davis-studio-apk
          path: davis-studio.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete davis-studio-latest --yes --cleanup-tag || true
          gh release create davis-studio-latest davis-studio.apk \
            --title "Davis Studio (latest)" \
            --notes "Latest Davis Studio Android build. Download davis-studio.apk and install it." \
            --target "${{ github.sha }}"
