name: Drama Engine (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      brief:
        description: "What the film is about"
        required: false
        default: ""
      design_run:
        description: "Reuse the design from this earlier run id (skips script + design)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "studio/drama/brief.txt"

permissions:
  contents: write

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  TAG: drama-${{ github.run_number }}

jobs:
  script-and-design:
    if: github.event.inputs.design_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get install -y -qq ffmpeg
          pip install -q "kaggle>=2.0" six anthropic kokoro-onnx==0.4.9 soundfile numpy
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          curl -sSfL -o voices-v1.0.bin "$base/voices-v1.0.bin"
      - name: Claude writes the screenplay
        run: |
          BRIEF="${{ github.event.inputs.brief }}"
          [ -z "$BRIEF" ] && BRIEF="$(cat studio/drama/brief.txt)"
          python studio/drama/write_script.py "$BRIEF" screenplay.json
      - name: Design characters, locations and shot frames (GPU)
        run: |
          python studio/drama/run.py push screenplay.json images davis-drama-design
          python studio/drama/run.py wait davis-drama-design 100
          python studio/drama/run.py fetch davis-drama-design design
          ls design/out/frames | head -50
      - name: Contact sheet for review
        run: |
          ffmpeg -loglevel error -y -pattern_type glob -i 'design/out/frames/*.png' -vf "scale=416:-2,tile=4x8" -frames:v 1 contact.jpg || true
          gh release view davis-videos >/dev/null 2>&1 || gh release create davis-videos --title "Davis Studio videos" --notes "Managed automatically."
          cp contact.jpg "$TAG-frames.jpg" && gh release upload davis-videos "$TAG-frames.jpg" --clobber || true
          for f in design/out/refs/char_*.png; do cp "$f" "$TAG-$(basename $f)"; gh release upload davis-videos "$TAG-$(basename $f)" --clobber; done || true
      - name: Voice references
        run: python studio/drama/run.py refs screenplay.json design/out/refs_voice
      - uses: actions/upload-artifact@v4
        with:
          name: design
          path: |
            screenplay.json
            design/out/frames/
            design/out/refs_voice/

  render:
    needs: script-and-design
    if: always() && needs.script-and-design.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "kaggle>=2.0" six
      - uses: actions/download-artifact@v4
        with:
          name: design
          run-id: ${{ github.event.inputs.design_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Upload assets to Kaggle
        run: |
          mkdir -p assets && cp -r design/out/frames assets/frames && cp -r design/out/refs_voice assets/refs
          python studio/drama/run.py dataset assets davis-drama-assets
      - name: Render all shots on two GPUs in parallel
        run: |
          python studio/drama/run.py push screenplay.json render davis-drama-render-0 0 2 davis-drama-assets
          python studio/drama/run.py push screenplay.json render davis-drama-render-1 1 2 davis-drama-assets
          python studio/drama/run.py wait davis-drama-render-0 davis-drama-render-1 340
      - name: Collect shots
        if: always()
        run: |
          python studio/drama/run.py fetch davis-drama-render-0 r0
          python studio/drama/run.py fetch davis-drama-render-1 r1
          mkdir -p shots && cp r0/out/shot_*.mp4 r1/out/shot_*.mp4 shots/ 2>/dev/null || true
          ls shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/

  assemble:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: design
          run-id: ${{ github.event.inputs.design_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: shots
          path: shots
      - name: Edit the film
        run: |
          python3 studio/drama/run.py assemble screenplay.json shots "$TAG.mp4"
          gh release upload davis-videos "$TAG.mp4" --clobber
          echo "FILM: https://github.com/${{ github.repository }}/releases/download/davis-videos/$TAG.mp4"
