name: Kaggle Kernel Logs

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated kernel slugs"
        default: "davis-drama-render-0 davis-drama-render-1"

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "kaggle>=2.0" six
      - run: |
          for s in ${{ github.event.inputs.slugs }}; do echo "===== $s"; python studio/drama/run.py fetch $s "o_$s" || true; done
