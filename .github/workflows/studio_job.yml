name: Davis Studio Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (letters, digits, dashes)"
        required: true
      mode:
        description: "replicate | topic | remix"
        required: true
        default: "topic"
      topic:
        description: "Topic (topic mode)"
        required: false
        default: ""
      notes:
        description: "Creator instructions"
        required: false
        default: ""
      voice:
        description: "Voice id"
        required: false
        default: "af_heart"
      source_job:
        description: "Job to remix (remix mode)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "studio/tests/trigger-job.txt"

permissions:
  contents: write

concurrency:
  group: studio-job-${{ github.event.inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ github.event.inputs.job_id }}
      JOB_MODE: ${{ github.event.inputs.mode }}
      JOB_TOPIC: ${{ github.event.inputs.topic }}
      JOB_NOTES: ${{ github.event.inputs.notes }}
      JOB_VOICE: ${{ github.event.inputs.voice }}
      JOB_SOURCE: ${{ github.event.inputs.source_job }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: studio/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -q -r studio/requirements.txt

      - name: Restore voice model
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-v1.0

      - name: Download voice model
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          curl -sSfL -o voices-v1.0.bin "$base/voices-v1.0.bin"

      - name: Validate job id
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9-]{1,60}$ ]]; then
            echo "Invalid job id"; exit 1
          fi

      - name: Run job
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m studio.job --job-id "$JOB_ID" --mode "$JOB_MODE" \
            --topic "$JOB_TOPIC" --notes "$JOB_NOTES" \
            --voice "${JOB_VOICE:-af_heart}" --source-job "$JOB_SOURCE"

      - name: Self-test (topic, then replicate the result)
        if: github.event_name == 'push'
        run: |
          set -e
          T="selftest-${{ github.run_number }}"
          python -m studio.job --job-id "$T-topic" --mode topic \
            --topic "Three everyday tasks you can hand to AI today" --voice af_heart

          gh release view davis-inbox >/dev/null 2>&1 || \
            gh release create davis-inbox --title "Davis Studio inbox" --notes "Reference uploads. Managed automatically."
          gh release download davis-videos --pattern "$T-topic.mp4" --dir tmp/ref
          mv "tmp/ref/$T-topic.mp4" "tmp/ref/$T-rep.mp4"
          gh release upload davis-inbox "tmp/ref/$T-rep.mp4" --clobber

          python -m studio.job --job-id "$T-rep" --mode replicate \
            --notes "Make it about saving money on groceries" --voice am_michael
